[package]
name = "dume"
version = "0.9.7"
description = "Scan one user's files into SQLite, browse them ncdu-style, and clean them with recipes"
license = "MIT"
edition = "2024"

[lib]
name = "dumelib"

[[bin]]
name = "dume-scan"
path = "src/main.rs"

[[bin]]
name = "dume"
path = "src/bin/dume.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
mimalloc = "0.1.52"
ratatui = "0.30.2"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled", "functions", "hooks"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
