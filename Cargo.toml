[package]
name = "dume"
version = "0.1.0"
description = "Export only one user's regular files as ncdu JSON"
license = "MIT"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
mimalloc = "0.1.52"
rayon = "1.12.0"
rustix = { version = "1.1.6", features = ["fs", "process"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
