name: CI

on:
  # Every branch push (not tags: the release workflow checks those).
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install ncdu
        run: sudo apt-get update && sudo apt-get install -y ncdu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test (includes ncdu round-trip)
        run: cargo test --locked
        env:
          DUME_REQUIRE_NCDU: "1"
